[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "narin-car-market"
version = "0.1.0"
description = "Reproducible car listing pipeline, market-price model, and inference API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.110,<1",
  "joblib>=1.3,<2",
  "numpy>=1.24,<3",
  "pandas>=2,<3",
  "pydantic>=2,<3",
  "scikit-learn>=1.4,<2",
  "uvicorn>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.5,<1"]
notebook = ["jupyterlab>=4,<5", "matplotlib>=3.8,<4", "seaborn>=0.13,<1"]

[project.scripts]
car-market = "car_market.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

